name: CI & CD

# ThirtyTutors's suite has no heavy
# model-download tests to separate out (speech_detection's real ML backend
# is mocked in every test - see tests/conftest.py's fake_speaker_backend),
# so there's just one test job.
#
# Not covered here: cli.py's platform-specific shortcut creation
# (Windows .lnk / macOS .app / Linux .desktop) and the actual desktop
# window (pywebview). Both are excluded from coverage (see pyproject.toml)
# and only ever verified manually - they need a real Windows/macOS/Linux
# desktop session to mean anything, which a CI runner isn't.

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade build tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install CPU-only torch
        # torch is a real dependency here (resemblyzer/speech_detection
        # needs it - see pyproject.toml), but a bare `pip install torch`
        # defaults to a multi-GB CUDA build even on this GPU-less runner.
        # The test suite never exercises the real model either way (see
        # conftest.py's fake_speaker_backend) - it only needs torch to be
        # importable, so the small CPU-only build is all CI needs.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: |
          pytest tests/ \
            -x --tb=short -q \
            --cov=thirtytutors \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  build-check:
    name: Package build check
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

  # ---------------------------------------------------------------------------
  # Publish to PyPI on a version tag push (e.g. v0.1.0) - uses PyPI's OIDC
  # "trusted publisher" flow (no API token stored as a secret). This needs a
  # one-time setup on PyPI's side first: on the project's PyPI page ->
  # Publishing -> add a trusted publisher pointing at this exact repo
  # (wiss84/thirtytutors), workflow file (ci-cd.yml), and environment name
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test, build-check]
    if: startsWith(github.ref, 'refs/tags/v')

    environment:
      name: pypi
      url: https://pypi.org/p/thirtytutors

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build distribution
        run: python -m build
      - name: Check distribution
        run: twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
