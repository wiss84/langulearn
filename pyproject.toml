[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langulearn"
dynamic = ["version"]
description = "LanguLearn has been renamed to ThirtyTutors - see https://github.com/wiss84/thirtytutors"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Wissam Metawee" }]
keywords = ["language-learning", "ai-tutor", "gemini", "voice-ai", "talking-avatar", "speech-to-speech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Education",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Framework :: FastAPI",
]

# This is the final release of langulearn - the project has been renamed
# to ThirtyTutors. All real dependencies have been deliberately removed
# for this release: cli.py's main() now only prints a redirect message,
# so nothing here needs fastapi/torch/etc. anymore, and a plain `pip
# install langulearn` stays fast and tiny instead of pulling ~1GB of ML
# dependencies for a package that no longer does anything.
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "httpx", "httpx2", "ruff", "langfuse"]
# Fully opt-in - see observability.py's module docstring. Nothing else in
# this app imports `langfuse` unconditionally, so installing without this
# extra is completely unaffected.

[project.urls]
Homepage = "https://github.com/wiss84/langulearn"
Repository = "https://github.com/wiss84/langulearn"
Issues = "https://github.com/wiss84/langulearn/issues"

[project.scripts]
langulearn = "langulearn.cli:main"

[tool.setuptools.dynamic]
# Single source of truth for the version is langulearn/constants.py's
# APP_VERSION - read directly from that attribute at build time, so
# there's exactly one place to bump per release instead of keeping this
# field manually in sync with a separate hardcoded string.
version = { attr = "langulearn.constants.APP_VERSION" }

[tool.setuptools.packages.find]
include = ["langulearn*"]

[tool.setuptools.package-data]
# Empty for this final stub release - no UI/static files needed for a
# package whose only job is to print a redirect message. See the note
# above dependencies for context.
langulearn = []

# ---------------------------------------------------------------------------
# Testing
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "unit: fast, pure-logic tests (no I/O)",
    "integration: tests that use the filesystem, SQLite, or a mocked websocket session",
]

[tool.coverage.run]
source = ["langulearn"]
omit = [
    "langulearn/scenarios/*",   # prompt text only, no logic to cover
    "langulearn/cli.py",        # platform-specific shortcut/download code - exercised manually, not under test
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 130
target-version = "py311"
exclude = ["langulearn/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",  # line length is handled loosely via line-length above, not enforced as an error
]
